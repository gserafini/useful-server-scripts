# Chrome launched through chrome-agentbrowser runs with TMPDIR=/var/lib/agentbrowser/tmp,
# so its per-launch com.google.Chrome.* and Playwright temp directories collect here
# instead of /tmp. Apply the same 10-day age cleanup that /tmp gets (B1929). Live
# sockets and non-empty directories are kept by systemd-tmpfiles.
d /var/lib/agentbrowser/tmp 0700 agentbrowser agentbrowser 10d
